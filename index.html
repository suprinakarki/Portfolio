<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAFC" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try { const t = localStorage.getItem('portfolio-theme'); document.documentElement.dataset.theme = t === 'dark' || t === 'light' ? t : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>
    <!--portfolio-meta-->
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.jsx"></script></body>
</html>
